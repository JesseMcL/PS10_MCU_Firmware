name: Build

on:
  push:
    branches: ["release/**"]
    tags: ["factory-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gputils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gputils && gpasm -v

      - name: Build (must be identical to the official image)
        run: |
          set -o pipefail
          mkdir -p build
          python3 tools/build.py | tee build/summary.txt

      - name: Emulator test
        run: python3 tools/test_factory.py

      - run: '{ echo "\`\`\`"; cat build/summary.txt; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY"'

      - uses: actions/upload-artifact@v4
        with:
          name: ps10-mcu-factory-1.0.5
          path: |
            build/ps10-mcu-factory-1.0.5.bin
            build/summary.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/factory-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ps10-mcu-factory-1.0.5.bin build/summary.txt \
            --title "Factory firmware 1.0.5" --notes-file build/summary.txt
