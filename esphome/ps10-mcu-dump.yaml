# ESPHome package: read the PS10 MCU's memory through the dump firmware.
#
#   packages:
#     mcu_dump: !include { file: ps10-mcu-dump.yaml, vars: { tuya_id: tuya_mcu } }
#
# `tuya_id` is the id of your `tuya:` component. If your config already has a
# `tuya: on_datapoint_update:` list, move the entry below into it instead.
#
# Press a "MCU dump" button with the dump firmware installed, keep the logs
# open (INFO level or lower for the `ps10dump` tag), save them to a file and
# run tools/dump2bin.py on it. Every chunk is logged as
#   [I][ps10dump:NNN]: F 0000 <hex>
# Requests that get no reply are retried; the dump stops after 5 failures.

substitutions:
  tuya_id: tuya_mcu

globals:
  - id: dump_space        # 'F', 'C', 'E', 0 = idle
    type: uint8_t
    initial_value: '0'
  - id: dump_addr
    type: uint16_t
    initial_value: '0'
  - id: dump_end
    type: uint16_t
    initial_value: '0'
  - id: dump_all          # continue F -> C -> E
    type: bool
    initial_value: 'false'
  - id: dump_sent_ms
    type: uint32_t
    initial_value: '0'
  - id: dump_tries
    type: uint8_t
    initial_value: '0'

script:
  - id: dump_request
    then:
      - lambda: |-
          const uint8_t step = id(dump_space) == 'E' ? 64 : 32;
          uint16_t n = id(dump_end) - id(dump_addr);
          if (n > step) n = step;
          std::vector<uint8_t> req{id(dump_space), uint8_t(id(dump_addr) >> 8),
                                   uint8_t(id(dump_addr) & 0xFF), uint8_t(n)};
          id(dump_sent_ms) = millis();
          id(${tuya_id}).force_set_raw_datapoint_value(200, req);
  - id: dump_start
    parameters:
      space: int
    then:
      - lambda: |-
          id(dump_space) = space;
          id(dump_addr) = 0;
          // program flash 10K words, configuration space 0x8000-0x80FF, data EEPROM 128 bytes
          id(dump_end) = space == 'F' ? 0x2800 : space == 'C' ? 0x100 : 0x80;
          id(dump_tries) = 0;
          ESP_LOGI("ps10dump", "start %c 0000-%04X", space, id(dump_end) - 1);
      - script.execute: dump_request

tuya:
  on_datapoint_update:
    - sensor_datapoint: 201
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() < 4 || x[0] != id(dump_space) || ((x[1] << 8) | x[2]) != id(dump_addr))
              return;  // not the reply we're waiting for
            const uint8_t n = x[3];
            if (n == 0) {
              ESP_LOGE("ps10dump", "%c %04X rejected by the MCU", x[0], id(dump_addr));
              id(dump_space) = 0;
              return;
            }
            std::string hex;
            for (size_t i = 4; i < x.size(); i++) {
              char b[3];
              snprintf(b, sizeof(b), "%02X", x[i]);
              hex += b;
            }
            ESP_LOGI("ps10dump", "%c %04X %s", x[0], id(dump_addr), hex.c_str());
            id(dump_addr) += n;
            id(dump_tries) = 0;
            if (id(dump_addr) < id(dump_end)) {
              id(dump_request).execute();
              return;
            }
            ESP_LOGI("ps10dump", "done %c", x[0]);
            const uint8_t next = !id(dump_all) ? 0 : x[0] == 'F' ? 'C' : x[0] == 'C' ? 'E' : 0;
            if (next == 0) {
              id(dump_space) = 0;
              id(dump_all) = false;
              ESP_LOGI("ps10dump", "finished");
            } else {
              id(dump_start).execute(next);
            }

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (id(dump_space) == 0 || millis() - id(dump_sent_ms) < 1500)
            return;
          if (++id(dump_tries) > 5) {
            ESP_LOGE("ps10dump", "%c %04X: no reply, giving up", id(dump_space), id(dump_addr));
            id(dump_space) = 0;
            id(dump_all) = false;
            return;
          }
          ESP_LOGW("ps10dump", "%c %04X: no reply, retrying", id(dump_space), id(dump_addr));
          id(dump_request).execute();

button:
  - platform: template
    name: MCU dump all
    entity_category: diagnostic
    on_press:
      - lambda: id(dump_all) = true;
      - script.execute: { id: dump_start, space: !lambda "return 'F';" }
  - platform: template
    name: MCU dump flash
    entity_category: diagnostic
    on_press:
      - script.execute: { id: dump_start, space: !lambda "return 'F';" }
  - platform: template
    name: MCU dump config
    entity_category: diagnostic
    on_press:
      - script.execute: { id: dump_start, space: !lambda "return 'C';" }
  - platform: template
    name: MCU dump EEPROM
    entity_category: diagnostic
    on_press:
      - script.execute: { id: dump_start, space: !lambda "return 'E';" }
