# ESPHome package for a PS10 running the open MCU firmware.
#
#   external_components:
#     - source: github://JesseMcL/esphome_virtual_uart
#       components: [virtual_uart]
#   packages:
#     mcu: !include { file: ps10-mcu.yaml, vars: { tuya_id: tuya_mcu, uart_id: mcu_uart } }
#
# `tuya_id` / `uart_id` are the ids of your `tuya:` component and of the UART
# it uses. Give `tuya:` that `uart_id:` explicitly: with the radar's virtual
# UART there's more than one. If your config already has a
# `tuya: on_datapoint_update:` list, move the entry below into it instead.
#
# The MCU only does I/O. Everything here that decides something (what the
# button does, what the LED shows) is ordinary ESPHome config: change it here.
#
# MCU datapoints: 1 radar OUT pin (enum 0/1), 110 output, 111 status LED,
# 112 light (raw 12-bit ADC), 113 switch input, 114 pushbutton, 202 radar bytes.
#
# Radar tuning, in the device's web page (web_server) rather than Home
# Assistant: "Radar engineering mode" streams per-gate energies into the log
# (tag ps10_gates), and ps10-gates.js draws them as a live chart with each
# gate's thresholds. "Radar calibrate" (or the radar_calibrate action) sets the
# thresholds from an empty room. Copy ps10-gates.js next to your device's YAML,
# or point `gates_js` at it.

substitutions:
  tuya_id: tuya_mcu
  uart_id: mcu_uart
  gates_js: ps10-gates.js

external_components:
  - source: github://JesseMcL/esphome_virtual_uart@main
    components: [virtual_uart]

tuya:
  id: ${tuya_id}
  uart_id: ${uart_id}
  on_datapoint_update:
    - sensor_datapoint: 202
      datapoint_type: raw
      then:
        # LD2410 frames have no checksum: ld2410 only checks their ends, so a
        # frame with bytes missing in the middle (a Tuya frame lost on the way,
        # for one) is read as wild distances and energies. Pass on only whole
        # frames whose length field matches; drop the rest.
        - lambda: |-
            static std::vector<uint8_t> buf;
            static uint32_t dropped;
            static const uint8_t DATA_HEAD[4] = {0xF4, 0xF3, 0xF2, 0xF1}, DATA_FOOT[4] = {0xF8, 0xF7, 0xF6, 0xF5};
            static const uint8_t CMD_HEAD[4] = {0xFD, 0xFC, 0xFB, 0xFA}, CMD_FOOT[4] = {0x04, 0x03, 0x02, 0x01};
            buf.insert(buf.end(), x.begin(), x.end());
            size_t pos = 0, skipped = 0;
            while (buf.size() - pos >= 4) {
              const uint8_t *p = buf.data() + pos;
              const uint8_t *foot = !memcmp(p, DATA_HEAD, 4) ? DATA_FOOT : !memcmp(p, CMD_HEAD, 4) ? CMD_FOOT : nullptr;
              if (foot == nullptr) { pos++; skipped++; continue; }
              if (buf.size() - pos < 6) break;
              size_t len = p[4] | p[5] << 8;
              if (len <= 64 && buf.size() - pos < 10 + len) break;
              if (len <= 64 && !memcmp(p + 6 + len, foot, 4)) {
                id(radar_uart).push(p, 10 + len);
                pos += 10 + len;
              } else {
                pos++;
                skipped++;
              }
            }
            buf.erase(buf.begin(), buf.begin() + pos);
            if (buf.size() > 512) { skipped += buf.size(); buf.clear(); }
            if (skipped) {
              dropped += skipped;
              ESP_LOGW("ps10", "radar: dropped %u bytes of broken frames (%u in total)", (unsigned) skipped, (unsigned) dropped);
            }

logger:
  logs:
    tuya: INFO            # DP 202 carries ~10 radar frames a second

# --- LD2410C, through the MCU ---------------------------------------------------
virtual_uart:
  - id: radar_uart
    baud_rate: 9600       # what the radar runs at on the MCU's software UART
    tx_chunk_size: 128    # the MCU takes at most 128 radar bytes per DP 202 write
    on_tx:
      - lambda: id(${tuya_id}).force_set_raw_datapoint_value(202, x);

ld2410:
  id: radar
  uart_id: radar_uart

# --- the MCU's I/O ----------------------------------------------------------------
switch:
  - platform: tuya
    tuya_id: ${tuya_id}
    id: output
    name: Output
    switch_datapoint: 110
    on_turn_on:
      - switch.turn_on: status_led
    on_turn_off:
      - switch.turn_off: status_led
  - platform: tuya
    tuya_id: ${tuya_id}
    id: status_led
    name: Status LED
    entity_category: config
    switch_datapoint: 111
  # Per-gate energies in the log and the web page chart. Web page only: not
  # in Home Assistant unless you enable it there.
  - platform: ld2410
    ld2410_id: radar
    engineering_mode:
      id: radar_engineering
      name: Radar engineering mode
      entity_category: config
      disabled_by_default: true

binary_sensor:
  - platform: tuya
    tuya_id: ${tuya_id}
    name: Radar OUT
    device_class: occupancy
    entity_category: diagnostic
    sensor_datapoint: 1
  - platform: tuya
    tuya_id: ${tuya_id}
    name: Switch input
    sensor_datapoint: 113
    on_press:
      - switch.toggle: output
  - platform: tuya
    tuya_id: ${tuya_id}
    id: pushbutton
    name: Button
    sensor_datapoint: 114
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - switch.toggle: output
  - platform: ld2410
    ld2410_id: radar
    has_target:
      id: radar_presence
      name: Presence
      on_press:
        - if:
            condition:
              select.is: { id: output_mode, options: [Auto] }
            then:
              - switch.turn_on: output
      on_release:
        - if:
            condition:
              select.is: { id: output_mode, options: [Auto] }
            then:
              - switch.turn_off: output
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target

sensor:
  - platform: tuya
    tuya_id: ${tuya_id}
    name: Light (raw)
    sensor_datapoint: 112
    state_class: measurement
    accuracy_decimals: 0
  - platform: ld2410
    ld2410_id: radar
    moving_distance:
      name: Moving distance
    still_distance:
      name: Still distance
    moving_energy:
      name: Moving energy
    still_energy:
      name: Still energy
    detection_distance:
      name: Detection distance
  # Gate energies (engineering mode only), for the log and the chart only
  - platform: ld2410
    ld2410_id: radar
    g0:
      move_energy: { id: gm0, internal: true }
      still_energy: { id: gs0, internal: true }
    g1:
      move_energy: { id: gm1, internal: true }
      still_energy: { id: gs1, internal: true }
    g2:
      move_energy: { id: gm2, internal: true }
      still_energy: { id: gs2, internal: true }
    g3:
      move_energy: { id: gm3, internal: true }
      still_energy: { id: gs3, internal: true }
    g4:
      move_energy: { id: gm4, internal: true }
      still_energy: { id: gs4, internal: true }
    g5:
      move_energy: { id: gm5, internal: true }
      still_energy: { id: gs5, internal: true }
    g6:
      move_energy: { id: gm6, internal: true }
      still_energy: { id: gs6, internal: true }
    g7:
      move_energy: { id: gm7, internal: true }
      still_energy: { id: gs7, internal: true }
    g8:
      move_energy: { id: gm8, internal: true }
      still_energy: { id: gs8, internal: true }

# Gate thresholds as the radar reports them, for the chart and calibration
number:
  - platform: ld2410
    ld2410_id: radar
    timeout: { id: radar_timeout, internal: true }
    max_move_distance_gate: { id: radar_max_move_gate, internal: true }
    max_still_distance_gate: { id: radar_max_still_gate, internal: true }
    g0:
      move_threshold: { id: tm0, internal: true }
      still_threshold: { id: ts0, internal: true }
    g1:
      move_threshold: { id: tm1, internal: true }
      still_threshold: { id: ts1, internal: true }
    g2:
      move_threshold: { id: tm2, internal: true }
      still_threshold: { id: ts2, internal: true }
    g3:
      move_threshold: { id: tm3, internal: true }
      still_threshold: { id: ts3, internal: true }
    g4:
      move_threshold: { id: tm4, internal: true }
      still_threshold: { id: ts4, internal: true }
    g5:
      move_threshold: { id: tm5, internal: true }
      still_threshold: { id: ts5, internal: true }
    g6:
      move_threshold: { id: tm6, internal: true }
      still_threshold: { id: ts6, internal: true }
    g7:
      move_threshold: { id: tm7, internal: true }
      still_threshold: { id: ts7, internal: true }
    g8:
      move_threshold: { id: tm8, internal: true }
      still_threshold: { id: ts8, internal: true }
  # Detection range, in cm: the farthest gate that counts for moving and
  # for still targets (gates are 75 cm at the radar's default resolution).
  - platform: template
    id: radar_moving_range
    name: Moving range
    entity_category: config
    unit_of_measurement: cm
    mode: slider
    min_value: 150
    max_value: 600
    step: 75
    update_interval: 2s
    lambda: |-
      if (!id(radar_max_move_gate).has_state()) return {};
      return id(radar_max_move_gate).state * 75;
    set_action:
      - lambda: |-
          id(radar_max_move_gate).publish_state(std::clamp<long>(std::lround(x / 75), 2, 8));
          id(radar).set_max_distances_timeout();   // also reads them back
  - platform: template
    id: radar_still_range
    name: Still range
    entity_category: config
    unit_of_measurement: cm
    mode: slider
    min_value: 150
    max_value: 600
    step: 75
    update_interval: 2s
    lambda: |-
      if (!id(radar_max_still_gate).has_state()) return {};
      return id(radar_max_still_gate).state * 75;
    set_action:
      - lambda: |-
          id(radar_max_still_gate).publish_state(std::clamp<long>(std::lround(x / 75), 2, 8));
          id(radar).set_max_distances_timeout();

text_sensor:
  - platform: ld2410
    ld2410_id: radar
    version:
      id: radar_version
      name: Radar firmware

# Auto: the output follows Presence (the radar's own hold time applies, see
# radar_set_range), and the LED follows the output. Manual: only the button,
# the switch input and Home Assistant switch it. The button and switch input
# work in both; in Auto the next presence change takes over again.
select:
  - platform: template
    id: output_mode
    name: Output mode
    entity_category: config
    options: [Auto, Manual]
    initial_option: Auto
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            select.is: { id: output_mode, options: [Auto] }
          then:
            - if:
                condition:
                  binary_sensor.is_on: radar_presence
                then:
                  - switch.turn_on: output
                else:
                  - switch.turn_off: output

button:
  - platform: template
    name: Radar calibrate
    entity_category: config
    disabled_by_default: true
    on_press:
      - script.execute: { id: radar_calibrate, start_delay: 10, seconds: 30, margin: 10 }

# --- radar tuning: chart and calibration -----------------------------------------
web_server:
  js_include: ${gates_js}

globals:
  - id: radar_cal_active
    type: bool
    initial_value: "false"
  - id: radar_cal_peak
    type: std::array<int, 18>     # moving gates 0-8, then still gates 0-8

# In engineering mode: energies 5 times a second, thresholds every 2 s, as
# "E m=<9 moving> s=<9 still>" and "T m=... s=..." under the ps10_gates tag.
interval:
  # ld2410 asks for the radar's firmware version once at boot, which the
  # radar can miss while it's starting up itself. Ask again until it answers
  # (at most 6 times).
  - interval: 10s
    then:
      - lambda: |-
          static uint8_t tries;
          if (id(radar_version).has_state() && !id(radar_version).state.empty()) return;
          if (tries >= 6) return;
          tries++;
          ESP_LOGI("ps10", "radar firmware version unknown, asking again (%u/6)", tries);
          id(radar).read_all_info();
  - interval: 100ms
    then:
      - lambda: |-
          static uint8_t n;
          if (!id(radar_engineering).state) return;
          sensor::Sensor *gm[9] = {id(gm0), id(gm1), id(gm2), id(gm3), id(gm4), id(gm5), id(gm6), id(gm7), id(gm8)}, *gs[9] = {id(gs0), id(gs1), id(gs2), id(gs3), id(gs4), id(gs5), id(gs6), id(gs7), id(gs8)};
          if (id(radar_cal_active))
            for (int i = 0; i < 9; i++) {
              float vm = gm[i]->get_raw_state(), vs = gs[i]->get_raw_state();
              if (vm <= 100) id(radar_cal_peak)[i] = std::max(id(radar_cal_peak)[i], (int) vm);   // false for NaN
              if (vs <= 100) id(radar_cal_peak)[9 + i] = std::max(id(radar_cal_peak)[9 + i], (int) vs);
            }
          n = (n + 1) % 20;
          auto list = [](sensor::Sensor *const *v, std::string &out) {
            for (int i = 0; i < 9; i++) {
              float x = v[i]->get_raw_state();
              out += (i ? "," : "") + (std::isnan(x) ? std::string("-") : std::to_string((int) x));
            }
          };
          if (n % 2 == 0) {
            std::string m, s;
            list(gm, m);
            list(gs, s);
            ESP_LOGI("ps10_gates", "E m=%s s=%s", m.c_str(), s.c_str());
          }
          if (n == 0) {
            number::Number *tm[9] = {id(tm0), id(tm1), id(tm2), id(tm3), id(tm4), id(tm5), id(tm6), id(tm7), id(tm8)}, *ts[9] = {id(ts0), id(ts1), id(ts2), id(ts3), id(ts4), id(ts5), id(ts6), id(ts7), id(ts8)};
            std::string m, s;
            for (int i = 0; i < 9; i++) {
              m += (i ? "," : "") + (tm[i]->has_state() ? std::to_string((int) tm[i]->state) : std::string("-"));
              s += (i ? "," : "") + (ts[i]->has_state() ? std::to_string((int) ts[i]->state) : std::string("-"));
            }
            auto num = [](number::Number *n) { return n->has_state() ? (int) n->state : -1; };
            ESP_LOGI("ps10_gates", "T m=%s s=%s r=%d,%d,%d", m.c_str(), s.c_str(), num(id(radar_max_move_gate)),
                     num(id(radar_max_still_gate)), num(id(radar_timeout)));
          }

# Calibration: engineering mode on, wait `start_delay` s (leave the room),
# record each gate's highest moving and still energy for `seconds` s, then set
# every threshold to that peak plus `margin` (at most 100), one gate at a time,
# and read them back. Engineering mode goes back to how it was.
script:
  - id: radar_calibrate
    mode: single
    parameters: { start_delay: int, seconds: int, margin: int }
    then:
      - globals.set: { id: radar_cal_active, value: "false" }
      - lambda: |-
          ESP_LOGI("ps10_gates", "C leave the room: calibrating in %d s, for %d s", start_delay, seconds);
      - if:
          condition:
            switch.is_off: radar_engineering
          then:
            - lambda: id(radar).set_engineering_mode(true);
      - delay: !lambda return std::max(start_delay, 3) * 1000;
      - lambda: |-
          id(radar_cal_peak).fill(0);
          id(radar_cal_active) = true;
          ESP_LOGI("ps10_gates", "C recording");
      - delay: !lambda return std::max(seconds, 5) * 1000;
      - lambda: |-
          id(radar_cal_active) = false;
          number::Number *tm[9] = {id(tm0), id(tm1), id(tm2), id(tm3), id(tm4), id(tm5), id(tm6), id(tm7), id(tm8)}, *ts[9] = {id(ts0), id(ts1), id(ts2), id(ts3), id(ts4), id(ts5), id(ts6), id(ts7), id(ts8)};
          std::string m, s;
          for (int i = 0; i < 9; i++) {
            int mv = std::min(id(radar_cal_peak)[i] + margin, 100), st = std::min(id(radar_cal_peak)[9 + i] + margin, 100);
            tm[i]->publish_state(mv);
            ts[i]->publish_state(st);
            m += (i ? "," : "") + std::to_string(mv);
            s += (i ? "," : "") + std::to_string(st);
          }
          ESP_LOGI("ps10_gates", "C setting thresholds m=%s s=%s", m.c_str(), s.c_str());
      - repeat:
          count: 9
          then:
            - lambda: id(radar).set_gate_threshold(iteration);   # also reads them back
            - delay: 1s
      - lambda: |-
          ESP_LOGI("ps10_gates", "C done");

# --- radar configuration, as Home Assistant actions ---------------------------------
# esphome.<device>_radar_set_gate: one gate (0-8), or all gates with gate 255
# esphome.<device>_radar_set_range: max moving/still gate (2-8), timeout (s);
#   the Moving range / Still range sliders set the same gates in cm
# esphome.<device>_radar_calibrate: start delay (s), duration (s), margin
# esphome.<device>_radar_bluetooth_password: 6 ASCII characters
# Each command is wrapped in enable/end configuration; the MCU sends them to
# the radar one at a time.
api:
  actions:
    - action: radar_set_gate
      variables: { gate: int, moving: int, still: int }
      then:
        - repeat:
            count: 9
            then:
              - if:
                  condition:
                    lambda: return gate == 255 || gate == (int) iteration;
                  then:
                    - lambda: |-
                        number::Number *tm[9] = {id(tm0), id(tm1), id(tm2), id(tm3), id(tm4), id(tm5), id(tm6), id(tm7), id(tm8)}, *ts[9] = {id(ts0), id(ts1), id(ts2), id(ts3), id(ts4), id(ts5), id(ts6), id(ts7), id(ts8)};
                        tm[iteration]->publish_state(std::clamp<int32_t>(moving, 0, 100));
                        ts[iteration]->publish_state(std::clamp<int32_t>(still, 0, 100));
                        id(radar).set_gate_threshold(iteration);   // also reads them back
                    - delay: 500ms
    - action: radar_set_range
      variables: { max_moving_gate: int, max_still_gate: int, timeout: int }
      then:
        - lambda: |-
            id(radar_max_move_gate).publish_state(std::clamp<int32_t>(max_moving_gate, 2, 8));
            id(radar_max_still_gate).publish_state(std::clamp<int32_t>(max_still_gate, 2, 8));
            id(radar_timeout).publish_state(std::clamp<int32_t>(timeout, 0, 65535));
            id(radar).set_max_distances_timeout();   // also reads them back
    - action: radar_calibrate
      variables: { start_delay: int, seconds: int, margin: int }
      then:
        - script.execute:
            id: radar_calibrate
            start_delay: !lambda return start_delay;
            seconds: !lambda return seconds;
            margin: !lambda return margin;
    - action: radar_bluetooth_password
      variables: { password: string }
      then:
        - if:
            condition:
              lambda: return password.size() == 6;
            then:
              - bluetooth_password.set:
                  id: radar
                  password: !lambda return password;
            else:
              - logger.log:
                  level: WARN
                  format: "Bluetooth password must be 6 characters"
