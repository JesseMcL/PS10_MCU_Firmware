# ESPHome package for a PS10 running the open MCU firmware.
#
#   external_components:
#     - source: github://JesseMcL/esphome_virtual_uart
#       components: [virtual_uart]
#   packages:
#     mcu: !include { file: ps10-mcu.yaml, vars: { tuya_id: tuya_mcu, uart_id: mcu_uart } }
#
# `tuya_id` / `uart_id` are the ids of your `tuya:` component and of the UART
# it uses. Give `tuya:` that `uart_id:` explicitly: with the radar's virtual
# UART there's more than one. If your config already has a
# `tuya: on_datapoint_update:` list, move the entry below into it instead.
#
# The MCU only does I/O. Everything here that decides something (what the
# button does, what the LED shows) is ordinary ESPHome config: change it here.
#
# MCU datapoints: 1 radar OUT pin (enum 0/1), 110 output, 111 status LED,
# 112 light (raw 12-bit ADC), 113 switch input, 114 pushbutton, 202 radar bytes,
# 203 radar relay on/off, 250 link diagnostics (logged under the ps10_diag tag).

substitutions:
  tuya_id: tuya_mcu
  uart_id: mcu_uart

external_components:
  - source: github://JesseMcL/esphome_virtual_uart@main
    components: [virtual_uart]

tuya:
  id: ${tuya_id}
  uart_id: ${uart_id}
  on_datapoint_update:
    - sensor_datapoint: 202
      datapoint_type: raw
      then:
        - virtual_uart.push:
            id: radar_uart
            data: !lambda return x;
    # MCU link diagnostics (firmware 0.2.5+, layout 2), every 2 s. Counters
    # are since the MCU started; layout in src/main.c (diag_send).
    - sensor_datapoint: 250
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() < 82 || x[0] != 2) return;
            auto u16 = [&](int i) { return (unsigned) (x[i] << 8 | x[i + 1]); };
            ESP_LOGI("ps10_diag",
                     "up %us rx %u frames %u badsum %u long %u partial %u hunted %u | fe %u pe %u ovr %u brk %u "
                     "polled %u qfull %u | irq/s %u (max %u) loops/s %u (min %u) lag %ums",
                     u16(8), u16(10), u16(12), u16(14), u16(16), u16(18), u16(32), u16(20), u16(22), u16(24),
                     u16(26), u16(28), u16(30), u16(34), u16(36), u16(38), u16(40), x[7]);
            ESP_LOGI("ps10_diag",
                     "high water: tuya rx %u/127 radar rx %u/127 radar tx %u/255 | radar ovf %u fe %u refused %u "
                     "blocked %u relay %u | seen %02X lsr %02X ier %02X state %u pcon %02X",
                     x[42], x[43], x[44], x[45], x[46], x[47], x[48], x[49], x[2], x[3], x[4], x[6], x[1]);
            ESP_LOGI("ps10_diag", "last rx: %s", format_hex_pretty(&x[50], 32).c_str());

logger:
  logs:
    tuya: INFO            # DP 202 carries ~10 radar frames a second

# --- LD2410C, through the MCU ---------------------------------------------------
virtual_uart:
  - id: radar_uart
    baud_rate: 9600       # what the radar runs at on the MCU's software UART
    tx_chunk_size: 128    # the MCU takes at most 128 radar bytes per DP 202 write
    on_tx:
      - lambda: id(${tuya_id}).force_set_raw_datapoint_value(202, x);

ld2410:
  id: radar
  uart_id: radar_uart

# --- the MCU's I/O ----------------------------------------------------------------
switch:
  - platform: tuya
    tuya_id: ${tuya_id}
    id: output
    name: Output
    switch_datapoint: 110
    on_turn_on:
      - switch.turn_on: status_led
    on_turn_off:
      - switch.turn_off: status_led
  # Off: the MCU stops relaying radar bytes (DP 202 writes still go to the
  # radar). For testing; on again at every MCU start-up.
  - platform: tuya
    tuya_id: ${tuya_id}
    id: radar_relay
    name: Radar relay
    entity_category: diagnostic
    switch_datapoint: 203
  # Radar configuration mode: the LD2410 stops its 10 Hz reports while in it,
  # and still answers commands. For testing; ld2410's own commands end it.
  - platform: template
    id: radar_config_mode
    name: Radar config mode
    entity_category: diagnostic
    optimistic: true
    turn_on_action:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]
    turn_off_action:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01]
  - platform: tuya
    tuya_id: ${tuya_id}
    id: status_led
    name: Status LED
    entity_category: config
    switch_datapoint: 111

binary_sensor:
  - platform: tuya
    tuya_id: ${tuya_id}
    name: Radar OUT
    device_class: occupancy
    entity_category: diagnostic
    sensor_datapoint: 1
  - platform: tuya
    tuya_id: ${tuya_id}
    name: Switch input
    sensor_datapoint: 113
    on_press:
      - switch.toggle: output
  - platform: tuya
    tuya_id: ${tuya_id}
    id: pushbutton
    name: Button
    sensor_datapoint: 114
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - switch.toggle: output
  - platform: ld2410
    ld2410_id: radar
    has_target:
      name: Presence
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target

sensor:
  - platform: tuya
    tuya_id: ${tuya_id}
    name: Light (raw)
    sensor_datapoint: 112
    state_class: measurement
    accuracy_decimals: 0
  - platform: ld2410
    ld2410_id: radar
    moving_distance:
      name: Moving distance
    still_distance:
      name: Still distance
    moving_energy:
      name: Moving energy
    still_energy:
      name: Still energy
    detection_distance:
      name: Detection distance

text_sensor:
  - platform: ld2410
    ld2410_id: radar
    version:
      name: Radar firmware

# --- radar configuration, as Home Assistant actions ---------------------------------
# esphome.<device>_radar_set_gate: one gate (0-8), or all gates with gate 255
# esphome.<device>_radar_set_range: max moving/still gate (2-8), timeout (s)
# esphome.<device>_radar_bluetooth_password: 6 ASCII characters
# esphome.<device>_radar_engineering_mode: per-gate energies on/off
# Each command is wrapped in enable/end configuration; the MCU sends them to
# the radar one at a time.
api:
  actions:
    - action: radar_set_gate
      variables: { gate: int, moving: int, still: int }
      then:
        - uart.write:
            id: radar_uart
            data: !lambda |-
              auto le32 = [](std::vector<uint8_t> &v, uint16_t word, uint32_t value) {
                v.insert(v.end(), {uint8_t(word), uint8_t(word >> 8), uint8_t(value), uint8_t(value >> 8),
                                   uint8_t(value >> 16), uint8_t(value >> 24)});
              };
              std::vector<uint8_t> v = {0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01,
                                        0xFD, 0xFC, 0xFB, 0xFA, 0x14, 0x00, 0x64, 0x00};
              le32(v, 0, gate >= 0 && gate <= 8 ? gate : 0xFFFF);
              le32(v, 1, std::clamp<int32_t>(moving, 0, 100));
              le32(v, 2, std::clamp<int32_t>(still, 0, 100));
              v.insert(v.end(), {0x04, 0x03, 0x02, 0x01, 0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01});
              return v;
    - action: radar_set_range
      variables: { max_moving_gate: int, max_still_gate: int, timeout: int }
      then:
        - uart.write:
            id: radar_uart
            data: !lambda |-
              auto le32 = [](std::vector<uint8_t> &v, uint16_t word, uint32_t value) {
                v.insert(v.end(), {uint8_t(word), uint8_t(word >> 8), uint8_t(value), uint8_t(value >> 8),
                                   uint8_t(value >> 16), uint8_t(value >> 24)});
              };
              std::vector<uint8_t> v = {0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01,
                                        0xFD, 0xFC, 0xFB, 0xFA, 0x14, 0x00, 0x60, 0x00};
              le32(v, 0, std::clamp<int32_t>(max_moving_gate, 2, 8));
              le32(v, 1, std::clamp<int32_t>(max_still_gate, 2, 8));
              le32(v, 2, std::clamp<int32_t>(timeout, 0, 65535));
              v.insert(v.end(), {0x04, 0x03, 0x02, 0x01, 0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01});
              return v;
    - action: radar_bluetooth_password
      variables: { password: string }
      then:
        - if:
            condition:
              lambda: return password.size() == 6;
            then:
              - bluetooth_password.set:
                  id: radar
                  password: !lambda return password;
            else:
              - logger.log:
                  level: WARN
                  format: "Bluetooth password must be 6 characters"
    - action: radar_engineering_mode
      variables: { enable: bool }
      then:
        - lambda: id(radar).set_engineering_mode(enable);
